{% extends "clips/base.html" %}

{% block title %}ログイン | valorantランキング{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>ログイン</h1>
  <form method="post" class="stack-form">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="form-errors">{{ form.non_field_errors }}</div>
    {% endif %}
    <label>
      {{ form.username.label }}
      {{ form.username }}
    </label>
    <label>
      {{ form.password.label }}
      {{ form.password }}
    </label>
    <button type="submit" class="btn">ログイン</button>
  </form>
  <p class="hint">アカウントがない場合は <a href="{% url 'clips:signup' %}">登録</a></p>
</section>
{% endblock %}
